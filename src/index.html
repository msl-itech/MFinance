    <!-- CSS Critique pour l'image LCP - évite les décalages -->
    <style>
      /* CSS critique pour l'image LCP */
      .expert-image {
        aspect-ratio: 4/3;
        min-height: 400px;
        background-color: #f8f9ff;
        contain: layout;
        will-change: auto;
        transform: translateZ(0);
        backface-visibility: hidden;
        object-fit: cover;
        width: 100%;
        max-width: 100%;
        height: 100%;
      }

      /* Optimisation du conteneur de l'image LCP */
      .image-section {
        contain: layout;

      }
