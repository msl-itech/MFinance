<div class="slider-container py-5" #sliderContainer>
  <div class="row">
    <div class="col-md-6 m-auto text-center">
      <div class="hadding hadding-p">
        <p class="text-red">
          <span class="text-red">Profil</span>
        </p>
        <h1>Secteur d'activité</h1>
      </div>
    </div>
  </div>
  <div class="slider-wrapper">
    <div class="slider" [style.transform]="getTransform()" role="region" aria-label="Secteurs d'activité">
      <div
        class="card"
        *ngFor="let item of items; let i = index"
        [ngClass]="i % 2 === 0 ? 'card-blue' : 'card-red'"
        [routerLink]="item.route"
      >
        <img [src]="item.image" alt="image">
        <div class="card-content">
          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>
          <a [routerLink]="item.route" class="learn-more">En savoir plus →</a>
        </div>
      </div>
    </div>
  </div>
  <div class="navigation-buttons">
    <button
      class="nav-btn"
      (click)="prevSlide()"
      [disabled]="currentIndex === 0"
      aria-label="Slide précédent"
    >
      <i class="fas fa-arrow-left"></i>
    </button>
    <button
      class="nav-btn"
      (click)="nextSlide()"
      [disabled]="isNextDisabled"
      aria-label="Slide suivant"
    >
      <i class="fas fa-arrow-right"></i>
    </button>
  </div>
</div>
