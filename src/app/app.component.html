<ng-container *ngIf="isLoaded$ | async">
  <!-- Header seulement pour desktop -->
  <ng-container *ngIf="(showHeaderFooter$ | async) && !(shouldUseMobileVersion$ | async)">
    <app-nav-bar></app-nav-bar>
  </ng-container>

  <router-outlet></router-outlet>

  <!-- Footer pour toutes les plateformes -->
  <ng-container *ngIf="showHeaderFooter$ | async">
    <app-footer></app-footer>
  </ng-container>
</ng-container>
