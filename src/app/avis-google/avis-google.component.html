<!-- Page d'avis moderne -->
<div class="avis-page">
  <div class="container">
    <div class="avis-card">
      <!-- Header de la carte -->
      <div class="card-header">
        <div class="brand">
          <h2>MFinances 💼</h2>
          <p>Votre partenaire financier de confiance</p>
        </div>
      </div>

      <!-- Contenu principal -->
      <div class="card-content">
        <!-- Titre principal -->
        <h1 class="main-title">Votre avis compte pour nous ! ❤️</h1>

        <!-- Description courte -->
        <p class="description">
          Partagez votre expérience avec MFinances et aidez d'autres clients à
          nous faire confiance.
        </p>

        <!-- Cercle avec icône -->
        <div class="trust-circle">
          <div class="handshake-icon">🤝</div>
        </div>

        <!-- Pointeur -->
        <div class="pointer">👇</div>

        <!-- Bouton principal -->
        <button
          class="btn-avis-modern"
          (click)="onLeaveFeedback()"
          type="button"
        >
          Je partage mon avis
        </button>

        <!-- Badge de remerciement -->
        <div class="thank-badge">
          <i class="fas fa-heart"></i>
          Merci pour votre confiance !
        </div>
      </div>
    </div>
  </div>
</div>
