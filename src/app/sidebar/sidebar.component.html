<div class="sidebar-widget">
  <!-- Section Profils -->
  <div class="widget">
    <h2>Profils</h2>
    <ul class="widget-category list-unstyled d-flex flex-column gap-2">
      <li *ngFor="let profil of profils">
        <a [routerLink]="profil.route" routerLinkActive="active">
          {{ profil.name }}
          <span><img src="assets/img/icon/arrow_up.svg" alt="" /></span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Section Structures -->
  <div class="widget mt-4">
    <h2>Structures</h2>
    <ul class="widget-category list-unstyled d-flex flex-column gap-2">
      <li *ngFor="let structure of structures">
        <a [routerLink]="structure.route" routerLinkActive="active">
          {{ structure.name }}
          <span><img src="assets/img/icon/arrow_up.svg" alt="" /></span>
        </a>
      </li>
    </ul>
  </div>

  <div class="widget contact-widget">
    <h2>Contact</h2>
    <div class="contact-info d-flex gap-3 flex-column">
      <p>
        <i class="fas fa-map-marker-alt"></i> 20 Rue de la Magnanerie, 1180
        Uccle
      </p>
      <p>
        <i class="fas fa-phone-alt"></i>
        <a href="tel:+3228830550">+32 2 886 05 50</a>
      </p>
      <p>
        <i class="fas fa-envelope"></i>
        <a href="mailto:info@mfinances.be"> info&#64;mfinances.be</a>
      </p>
    </div>

    <div class="review-section mt-3">
      <button
        class="btn btn-warning btn-sm w-100"
        (click)="openGoogleReview()"
        style="border-radius: 20px; font-weight: 600"
      >
        <i class="fab fa-google me-2"></i>Laisser un avis
      </button>
    </div>
  </div>
</div>
