
<div class="home2-about color-header sec-padding">
 <div class="container gap-4">
         <!-- Header avec titre et sous-titre -->
      <div class="card-header">
        <div class="brand">
          <h2>Votre activité travaille<br/>-t-elle pour vous ?</h2>
          <p class="subtitle">
            <strong><i>Gratuit - Simple - Confidentiel</i></strong>
          </p>
        </div>
      </div>

      <div class="card-content">
        <h3 class="main-title">Estimez votre valeur</h3>
        <p class="description">Sélectionnez votre secteur d'activité</p>

        <!-- Custom select wrapper pour compatibilité Safari -->
        <div class="select-wrapper">
          <select [(ngModel)]="selectedOption" class="custom-select">
            <option value="" disabled selected>Choisissez votre secteur</option>
            <option *ngFor="let opt of options" [value]="opt.label">{{ opt.label }}</option>
          </select>
          <div class="select-arrow">
            <svg width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="card-footer">
        <button class="start-btn" (click)="redirectToForm()">
          <span class="btn-text">Commencer le test maintenant</span>
          <span class="btn-icon">→</span>
        </button>
        <div class="separator"></div>
        <p class="confidential">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" class="lock-icon">
            <path d="M12.5 7H3.5C2.67157 7 2 7.67157 2 8.5V13.5C2 14.3284 2.67157 15 3.5 15H12.5C13.3284 15 14 14.3284 14 13.5V8.5C14 7.67157 13.3284 7 12.5 7Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4.5 7V4.5C4.5 3.57174 4.86875 2.6815 5.52513 2.02513C6.1815 1.36875 7.07174 1 8 1C8.92826 1 9.8185 1.36875 10.4749 2.02513C11.1313 2.6815 11.5 3.57174 11.5 4.5V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <strong>Vous seul(e) aurez accès à votre résultat.</strong>
        </p>
      </div>
 </div>

</div>
